<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>文本统计 · 小工具箱</title><link rel="stylesheet" href="style.css"></head><body><main>
<h1>文本统计</h1><p class="sub">输入时实时统计。下方按钮按行处理文本。</p>
<textarea id="i" placeholder="在这里输入或粘贴文本" spellcheck="false"></textarea>
<div id="s" class="stats"></div>
<div class="row"><button onclick="L(a=>[...new Set(a)])">按行去重</button><button onclick="L(a=>a.filter(x=>x.trim()))">删除空行</button><button onclick="L(a=>[...a].sort((x,y)=>x.localeCompare(y,'zh')))">按行排序</button><button onclick="i.value=i.value.toUpperCase();up()">转大写</button><button onclick="i.value=i.value.toLowerCase();up()">转小写</button><button onclick="cp(i.value,this)">复制</button></div>
</main><script src="app.js"></script>
<script>
const i=$('#i');
function up(){const t=i.value,cn=(t.match(/[\u4e00-\u9fff]/g)||[]).length,en=(t.match(/[A-Za-z0-9]+(?:['’-][A-Za-z0-9]+)*/g)||[]).length;
$('#s').innerHTML=[["字符（含空格）",[...t].length],["字符（不含空格）",[...t.replace(/\s/g,'')].length],["中文字数",cn],["英文单词",en],["行数",t?t.split('\n').length:0]].map(([a,b])=>`<div><b>${b}</b>${a}</div>`).join('')}
function L(fn){i.value=fn(i.value.split('\n')).join('\n');up()}
i.oninput=up;up();
</script></body></html>
